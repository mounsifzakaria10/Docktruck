<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WareTruck — Suivi des camions</title>

<!-- Bibliothèques -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0d0f14; --surface: #161922; --surface2: #1e2330; --border: #2a3045;
    --accent: #00e5a0; --accent2: #0066ff; --warn: #ffaa00; --danger: #ff4455;
    --text: #e8eaf2; --muted: #6b7491; --radius: 10px;
    --font-head: 'Syne', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-mono); min-height: 100vh; }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }
  #login-screen { align-items: center; justify-content: center; padding: 2rem; position: relative; overflow: hidden; }
  .login-box { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem 2rem; z-index: 1; }
  .login-logo { font-family: var(--font-head); font-size: 1.8rem; font-weight: 800; margin-bottom: 0.25rem; }
  .login-logo span { color: var(--accent); }
  .tabs { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.5rem; }
  .tab-btn { flex: 1; padding: 0.55rem; background: none; border: none; color: var(--muted); cursor: pointer; }
  .tab-btn.active { background: var(--accent); color: #000; font-weight: 600; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.7rem; color: var(--muted); margin-bottom: 0.4rem; text-transform: uppercase; }
  .field input, .field select { width: 100%; padding: 0.65rem 0.85rem; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); outline: none; }
  .btn { width: 100%; padding: 0.75rem; background: var(--accent); color: #000; border: none; border-radius: var(--radius); font-family: var(--font-head); font-weight: 700; cursor: pointer; }
  .btn.secondary { background: none; color: var(--accent); border: 1px solid var(--accent); margin-top: 0.75rem; }
  .btn.sm { width: auto; padding: 0.4rem 0.85rem; font-size: 0.78rem; }
  .btn.danger { background: var(--danger); color: #fff; }
  .msg { font-size: 0.78rem; margin-top: 0.75rem; padding: 0.6rem 0.85rem; border-radius: 6px; display: none; }
  .msg.error { background: rgba(255,68,85,0.1); color: var(--danger); border: 1px solid var(--danger); display: block; }
  .app-layout { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem 0; position: fixed; height: 100vh; }
  .main-content { margin-left: 220px; flex: 1; padding: 2rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.25rem; }
  .qr-card-photo { display: flex; justify-content: center; margin: 1rem 0; }
  .qr-card-inner { width: 320px; background: #0d0f14; border: 1px solid var(--accent); border-radius: 20px; padding: 1.5rem; text-align: center; }
  .qr-card-qr canvas { background: #fff; border-radius: 8px; padding: 5px; }
  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--accent); color: #000; padding: 0.75rem 1.25rem; border-radius: var(--radius); opacity: 0; transition: 0.3s; pointer-events: none; z-index: 9999; }
  .toast.show { opacity: 1; }
  .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.7rem; text-transform: uppercase; }
  .badge.waiting { background: #333; color: #fff; }
  .badge.arrived { background: var(--accent2); color: #fff; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  th { text-align: left; color: var(--muted); padding: 0.5rem; border-bottom: 1px solid var(--border); }
  td { padding: 0.8rem 0.5rem; border-bottom: 1px solid #1e2330; }
  @media (max-width: 700px) { .sidebar { display: none; } .main-content { margin-left: 0; } }
</style>
</head>
<body>

<div id="login-screen" class="screen active">
  <div class="login-box">
    <div class="login-logo">Ware<span>Truck</span></div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchAuthTab('login')">Connexion</button>
      <button class="tab-btn" onclick="switchAuthTab('register')">Inscription</button>
    </div>
    <div id="form-login">
      <div class="field"><label>Email</label><input type="email" id="login-email"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="login-pass"></div>
      <div id="login-msg" class="msg"></div>
      <button class="btn" onclick="doLogin()">Se connecter</button>
      <div style="margin-top:1rem; display:flex; gap:5px;">
        <button class="btn sm secondary" onclick="quickLogin('driver@demo.com','drv123')">Chauffeur</button>
        <button class="btn sm secondary" onclick="quickLogin('admin@demo.com','admin123')">Admin</button>
      </div>
    </div>
    <div id="form-register" style="display:none">
      <div class="field"><label>Nom complet</label><input type="text" id="reg-name"></div>
      <div class="field"><label>Email</label><input type="email" id="reg-email"></div>
      <div class="field"><label>Véhicule</label><input type="text" id="reg-vehicle"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="reg-pass"></div>
      <div id="reg-msg" class="msg"></div>
      <button class="btn" onclick="doRegister()">Créer mon compte</button>
    </div>
  </div>
</div>

<div id="app-screen" class="screen">
  <div class="app-layout">
    <nav class="sidebar">
      <div style="padding: 1.5rem;" class="login-logo">Ware<span>Truck</span></div>
      <div id="nav-items"></div>
      <button class="btn danger sm" style="margin: 2rem;" onclick="doLogout()">Déconnexion</button>
    </nav>
    <main class="main-content">
      <div id="page-driver-profile" class="page">
        <h2 id="welcome-name">Profil</h2>
        <div class="card" id="profile-info-display"></div>
        <div class="card">
            <h3>Ma Carte Chauffeur</h3>
            <div class="qr-card-photo">
                <div class="qr-card-inner" id="printable-card">
                    <div style="color:var(--accent); font-weight:800; margin-bottom:1rem;">WARETRUCK ID</div>
                    <h2 id="card-name">...</h2>
                    <p id="card-vehicle" style="color:var(--muted); margin-bottom:1rem;">...</p>
                    <div class="qr-card-qr"><canvas id="driver-qr-canvas"></canvas></div>
                    <p id="card-qr-text" style="font-size:0.6rem; color:var(--muted); margin-top:1rem;">...</p>
                </div>
            </div>
            <button class="btn sm" onclick="downloadDriverCard()">📥 Télécharger ma carte</button>
        </div>
      </div>
      <!-- Pages dynamiques injectées par JS -->
      <div id="page-admin-dashboard" class="page"><h2>Dashboard Admin</h2><div id="admin-stats" style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin:1rem 0;"></div></div>
      <div id="page-operator-scan" class="page"><h2>Scanner Dock</h2><div id="reader" style="width:300px; margin:1rem 0;"></div></div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const SUPABASE_URL = 'https://ivfoeoxhbzvuvtlmbgwi.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2Zm9lb3hoYnp2dXZ0bG1iZ3dpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTQ0NjcsImV4cCI6MjA5NDMzMDQ2N30.eWiSABzSQuwfE2EkcRPVr27R0jxQfTnBDbODjNfs6sQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null, currentProfile = null, currentDriver = null;

    // --- FONCTIONS CORE ---
    function showToast(m, err=false) {
        const t = document.getElementById('toast');
        t.textContent = m; t.style.background = err ? '#ff4455' : '#00e5a0';
        t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
    }

    function generateQR(canvasId, text, size = 200) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        QRCode.toCanvas(canvas, text, { width: size, margin: 2, color: { dark: "#000000", light: "#ffffff" } });
    }

    // --- AUTH ---
    window.doLogin = async () => {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
        if (error) return alert(error.message);
        loadUserData(data.user);
    };

    window.quickLogin = (e, p) => { document.getElementById('login-email').value=e; document.getElementById('login-pass').value=p; window.doLogin(); };

    window.doRegister = async () => {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;
        const vehicle = document.getElementById('reg-vehicle').value;
        const { data, error } = await supabase.auth.signUp({ email, password: pass, options: { data: { name, role: 'driver' } } });
        if (error) return alert(error.message);
        await new Promise(r => setTimeout(r, 2000));
        await supabase.from('drivers').insert([{ user_id: data.user.id, vehicle, qr_code: 'DRV-'+Date.now() }]);
        alert("Compte créé ! Connectez-vous.");
        window.switchAuthTab('login');
    };

    async function loadUserData(user) {
        currentUser = user;
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
        currentProfile = profile;
        if (profile.role === 'driver') {
            const { data: drv } = await supabase.from('drivers').select('*').eq('user_id', user.id).single();
            currentDriver = drv;
        }
        document.getElementById('login-screen').classList.remove('active');
        document.getElementById('app-screen').classList.add('active');
        setupNav();
    }

    window.doLogout = async () => { await supabase.auth.signOut(); location.reload(); };

    window.switchAuthTab = (t) => {
        document.getElementById('form-login').style.display = t === 'login' ? 'block' : 'none';
        document.getElementById('form-register').style.display = t === 'register' ? 'block' : 'none';
    };

    // --- NAVIGATION ---
    function setupNav() {
        const role = currentProfile.role;
        const items = role === 'driver' ? [{id:'driver-profile', n:'Mon Profil'}] : [{id:'admin-dashboard', n:'Dashboard'}];
        document.getElementById('nav-items').innerHTML = items.map(i => `<div onclick="goTo('${i.id}')" style="padding:1rem; cursor:pointer;">${i.n}</div>`).join('');
        window.goTo(items[0].id);
    }

    window.goTo = (id) => {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        document.getElementById('page-' + id).style.display = 'block';
        if(id === 'driver-profile') renderDriverProfile();
    };

    function renderDriverProfile() {
        document.getElementById('welcome-name').textContent = "Bienvenue, " + currentProfile.name;
        document.getElementById('card-name').textContent = currentProfile.name;
        document.getElementById('card-vehicle').textContent = "Camion: " + currentDriver.vehicle;
        document.getElementById('card-qr-text').textContent = currentDriver.qr_code;
        setTimeout(() => generateQR('driver-qr-canvas', currentDriver.qr_code), 100);
    }

    // --- LE TÉLÉCHARGEMENT (CORRIGÉ) ---
    window.downloadDriverCard = async () => {
        if (!currentDriver) return;
        showToast("Génération de l'image...");
        
        const mainCanvas = document.getElementById('driver-qr-canvas');
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = 400; finalCanvas.height = 600;
        const ctx = finalCanvas.getContext('2d');

        // Fond Noir
        ctx.fillStyle = '#0d0f14';
        ctx.fillRect(0, 0, 400, 600);

        // Bordure verte
        ctx.strokeStyle = '#00e5a0'; ctx.lineWidth = 10;
        ctx.strokeRect(5, 5, 390, 590);

        // Textes
        ctx.fillStyle = '#00e5a0'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText("WARETRUCK ID", 200, 60);

        ctx.fillStyle = '#ffffff'; ctx.font = '24px sans-serif';
        ctx.fillText(currentProfile.name, 200, 120);
        
        ctx.fillStyle = '#6b7491'; ctx.font = '18px sans-serif';
        ctx.fillText(currentDriver.vehicle, 200, 150);

        // QR Code : On dessine un fond blanc d'abord pour éviter la transparence
        const qrX = 75, qrY = 200, qrSize = 250;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(qrX - 10, qrY - 10, qrSize + 20, qrSize + 20);
        
        // On copie le QR Code affiché à l'écran
        ctx.drawImage(mainCanvas, qrX, qrY, qrSize, qrSize);

        // ID texte en bas
        ctx.fillStyle = '#6b7491'; ctx.font = '12px monospace';
        ctx.fillText(currentDriver.qr_code, 200, 500);

        // Téléchargement
        const link = document.createElement('a');
        link.download = `carte-${currentProfile.name}.png`;
        link.href = finalCanvas.toDataURL('image/png');
        link.click();
        showToast("Carte téléchargée ✅");
    };

    // Helper pour les autres pages
    window.downloadQR = (text, name) => {
        const c = document.createElement('canvas');
        QRCode.toCanvas(c, text, (err) => {
            const link = document.createElement('a');
            link.download = name + '.png'; link.href = c.toDataURL(); link.click();
        });
    };

    // Auto-login session
    const { data: { session } } = await supabase.auth.getSession();
    if (session) loadUserData(session.user);
});
</script>
</body>
</html>
